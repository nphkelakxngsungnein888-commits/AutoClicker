name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: AutoClicker

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q AutoClicker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon lintDebug

  release:
    name: Build and publish release APK
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q AutoClicker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "::error::ไม่พบ app/debug.keystore ใน AutoClicker.zip"
            exit 1
          fi

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: >
          gradle --no-daemon assembleRelease
          -PbuildNumber=$BUILD_NUMBER
          -PupdateRepo=${{ github.repository }}

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AutoClicker-$BUILD_NUMBER.apk"
          (cd dist && sha256sum "AutoClicker-$BUILD_NUMBER.apk" > "AutoClicker-$BUILD_NUMBER.apk.sha256")

      - name: Publish release "latest"
        working-directory: .
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoClicker/dist/* \
            --title "Build #$BUILD_NUMBER" \
            --notes "Build #$BUILD_NUMBER" \
            --target "$GITHUB_SHA"
